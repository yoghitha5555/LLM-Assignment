apiVersion: v1
kind: Service
metadata:
  name: k8s-crud-app-service
spec:
  # Using NodePort to easily access it on local clusters like Minikube.
  # Change to LoadBalancer if deploying on a cloud provider (AWS/GCP/Azure)
  type: LoadBalancer 
  selector:
    app: k8s-crud-app
  ports:
    - protocol: TCP
      port: 30001       # Port the Service listens on locally via LoadBalancer
      targetPort: 3000 # Port the Container listens on
